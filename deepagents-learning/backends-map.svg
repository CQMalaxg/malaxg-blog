<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Deep Agents 后端与沙箱选型地图</title>
  <desc id="desc">文件工具通过 backend 抽象读写不同存储：StateBackend 存在内存状态、FilesystemBackend 读写本地磁盘、StoreBackend 跨线程持久化、Sandbox 后端额外提供 execute 命令执行能力，CompositeBackend 按路径把它们组合起来。</desc>
  <style>
    :root {
      --bg: #f6f3eb;
      --fg: #1d2935;
      --muted: #66727c;
      --line: #7b8790;
      --border: #c8c8bd;
      --state: #d9e1f1;
      --disk: #f5e4b8;
      --store: #d5e8df;
      --sandbox: #f6d7c9;
      --zone: #e9e6dc;
      --accent: #476d7c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b2023;
        --fg: #eef1eb;
        --muted: #b1b9b6;
        --line: #9ca9a6;
        --border: #596463;
        --state: #344b60;
        --disk: #665535;
        --store: #31554b;
        --sandbox: #69493f;
        --zone: #252c2f;
        --accent: #9bc3cf;
      }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 8 7; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.5; marker-end: url(#arrow); }
    .edge-dashed { fill: none; stroke: var(--line); stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    .node { stroke: var(--border); stroke-width: 1.5; }
    .state { fill: var(--state); }
    .disk { fill: var(--disk); }
    .store { fill: var(--store); }
    .sandbox { fill: var(--sandbox); }
    .eyebrow { fill: var(--accent); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
    .title { fill: var(--fg); font: 700 29px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .label { fill: var(--fg); font: 700 20px/1.3 ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--muted); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .code { fill: var(--accent); font: 600 15px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .path { fill: var(--accent); font: 700 14px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720" />
  <text class="eyebrow" x="48" y="52">BACKENDS / WHERE FILES LIVE</text>
  <text class="title" x="48" y="90">同一套文件工具，四种存储位置</text>
  <text class="small" x="48" y="120">ls / read_file / write_file / edit_file / glob / grep 都通过 backend 抽象读写，CompositeBackend 再按路径把它们路由到不同后端。</text>

  <!-- Agent + file tools -->
  <rect class="node state" x="440" y="150" width="320" height="96" rx="12" />
  <text class="eyebrow" x="466" y="184">AGENT FILE TOOLS</text>
  <text class="label" x="466" y="214">ls · read · write · edit · glob · grep</text>
  <text class="small" x="466" y="236">execute（仅 sandbox 后端可见）</text>

  <path class="edge" d="M 600 246 V 286" />
  <rect class="node zone" x="120" y="286" width="960" height="60" rx="10" />
  <text class="label" x="146" y="323">CompositeBackend · 按路径 first-match 路由到具体后端</text>
  <text class="path" x="720" y="323">default + routes{...}</text>

  <!-- 4 backends -->
  <path class="edge" d="M 240 346 V 396" />
  <rect class="node state" x="120" y="396" width="220" height="230" rx="12" />
  <text class="code" x="146" y="432">StateBackend</text>
  <text class="label" x="146" y="466">内存 · 默认</text>
  <text class="small" x="146" y="498">存在 LangGraph state</text>
  <text class="small" x="146" y="522">随线程存在</text>
  <text class="small" x="146" y="562">适合：demo、临时</text>
  <text class="small" x="146" y="586">scratchpad、草稿</text>

  <path class="edge" d="M 480 346 V 396" />
  <rect class="node disk" x="360" y="396" width="220" height="230" rx="12" />
  <text class="code" x="386" y="432">FilesystemBackend</text>
  <text class="label" x="386" y="466">本地磁盘</text>
  <text class="small" x="386" y="498">root_dir 限定根目录</text>
  <text class="small" x="386" y="522">virtual_mode=True</text>
  <text class="small" x="386" y="562">适合：本地开发、CI</text>
  <text class="small" x="386" y="586">注意 secrets 泄露风险</text>

  <path class="edge" d="M 720 346 V 396" />
  <rect class="node store" x="600" y="396" width="220" height="230" rx="12" />
  <text class="code" x="626" y="432">StoreBackend</text>
  <text class="label" x="626" y="466">跨线程持久</text>
  <text class="small" x="626" y="498">存进 LangGraph store</text>
  <text class="small" x="626" y="522">namespace 隔离用户</text>
  <text class="small" x="626" y="562">适合：长期 memory、</text>
  <text class="small" x="626" y="586">跨会话数据</text>

  <path class="edge" d="M 960 346 V 396" />
  <rect class="node sandbox" x="840" y="396" width="220" height="230" rx="12" />
  <text class="code" x="866" y="432">Sandbox</text>
  <text class="label" x="866" y="466">隔离环境 + execute</text>
  <text class="small" x="866" y="498">Modal / E2B / Daytona</text>
  <text class="small" x="866" y="522">Runloop / LangSmith …</text>
  <text class="small" x="866" y="562">适合：跑命令、装依赖</text>
  <text class="small" x="866" y="586">切记 secrets 留在沙箱外</text>

  <text class="small" x="120" y="672">典型组合：/workspace/ → State（临时）· /memories/ → Store（持久）· /docs/ → 只读 · /outputs/ → 磁盘或对象存储。</text>
  <text class="small" x="120" y="698">Permissions 只约束内置文件工具且遵循 first-match-wins；sandbox 后端因支持任意命令执行，不受权限规则约束。</text>
</svg>
