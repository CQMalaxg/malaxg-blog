<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Deep Agents 默认中间件栈</title>
  <desc id="desc">一次 agent 请求会依次穿过 Skills、Filesystem、SubAgent、Summarization、PatchToolCalls、PromptCaching、Memory、HumanInTheLoop 等中间件，其中部分层只在传入对应参数时才启用。</desc>
  <style>
    :root {
      --bg: #f6f3eb;
      --fg: #1d2935;
      --muted: #66727c;
      --line: #7b8790;
      --border: #c8c8bd;
      --always: #d9e1f1;
      --optional: #f5e4b8;
      --core: #d5e8df;
      --enter: #f6d7c9;
      --zone: #e9e6dc;
      --accent: #476d7c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b2023;
        --fg: #eef1eb;
        --muted: #b1b9b6;
        --line: #9ca9a6;
        --border: #596463;
        --always: #344b60;
        --optional: #665535;
        --core: #31554b;
        --enter: #69493f;
        --zone: #252c2f;
        --accent: #9bc3cf;
      }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 8 7; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.5; marker-end: url(#arrow); }
    .node { stroke: var(--border); stroke-width: 1.5; }
    .always { fill: var(--always); }
    .optional { fill: var(--optional); }
    .core { fill: var(--core); }
    .enter { fill: var(--enter); }
    .eyebrow { fill: var(--accent); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
    .title { fill: var(--fg); font: 700 29px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .label { fill: var(--fg); font: 700 20px/1.3 ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--muted); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .tag { fill: var(--accent); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1px; }
    .code { fill: var(--accent); font: 600 15px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" />
  <text class="eyebrow" x="48" y="52">MIDDLEWARE STACK / REQUEST PIPELINE</text>
  <text class="title" x="48" y="90">一次请求，如何穿过默认中间件栈</text>
  <text class="small" x="48" y="120">create_deep_agent 会自动组装这条流水线；你传入的自定义中间件按 .name 匹配替换，否则插在 Patch 之后。</text>

  <!-- Legend -->
  <rect class="node always" x="770" y="40" width="20" height="20" rx="3" />
  <text class="small" x="798" y="56">始终启用</text>
  <rect class="node optional" x="900" y="40" width="20" height="20" rx="3" />
  <text class="small" x="928" y="56">按参数启用</text>
  <rect class="node core" x="1058" y="40" width="20" height="20" rx="3" />
  <text class="small" x="1086" y="56">核心支架</text>

  <!-- Enter -->
  <rect class="node enter" x="48" y="150" width="230" height="66" rx="10" />
  <text class="label" x="70" y="180">用户 / invoke</text>
  <text class="small" x="70" y="203">messages + config</text>

  <path class="edge" d="M 278 183 H 340" />

  <!-- Pipeline column -->
  <!-- Row helper geometry: x=360, w=490 -->
  <rect class="node optional" x="360" y="150" width="490" height="52" rx="8" />
  <text class="label" x="384" y="176">1 · SkillsMiddleware</text>
  <text class="small" x="384" y="194">传入 skills 时启用 · 先注入 skill 元数据</text>
  <text class="tag" x="812" y="181">skills</text>

  <path class="edge" d="M 605 202 V 224" />
  <rect class="node core" x="360" y="224" width="490" height="52" rx="8" />
  <text class="label" x="384" y="250">2 · FilesystemMiddleware</text>
  <text class="small" x="384" y="268">读写 / 权限校验在此执行 · 必需支架</text>
  <text class="tag" x="792" y="255">backend</text>

  <path class="edge" d="M 605 276 V 298" />
  <rect class="node always" x="360" y="298" width="490" height="52" rx="8" />
  <text class="label" x="384" y="324">3 · SubAgentMiddleware</text>
  <text class="small" x="384" y="342">暴露 task 工具 · 委派子任务</text>

  <path class="edge" d="M 605 350 V 372" />
  <rect class="node always" x="360" y="372" width="490" height="52" rx="8" />
  <text class="label" x="384" y="398">4 · SummarizationMiddleware</text>
  <text class="small" x="384" y="416">对话过长时压缩历史 · 85% 阈值触发</text>

  <path class="edge" d="M 605 424 V 446" />
  <rect class="node core" x="360" y="446" width="490" height="52" rx="8" />
  <text class="label" x="384" y="472">5 · PatchToolCallsMiddleware</text>
  <text class="small" x="384" y="490">修复中断恢复后遗留的悬空工具调用</text>

  <path class="edge" d="M 605 498 V 520" />
  <rect class="node always" x="360" y="520" width="490" height="52" rx="8" />
  <text class="label" x="384" y="546">6 · PromptCaching (Anthropic / Bedrock)</text>
  <text class="small" x="384" y="564">始终注册 · 不支持的模型自动 no-op</text>

  <path class="edge" d="M 605 572 V 594" />
  <rect class="node optional" x="360" y="594" width="490" height="52" rx="8" />
  <text class="label" x="384" y="620">7 · MemoryMiddleware</text>
  <text class="small" x="384" y="638">传入 memory 时启用 · 缓存之后减少失效</text>
  <text class="tag" x="800" y="625">memory</text>

  <path class="edge" d="M 605 646 V 668" />
  <rect class="node optional" x="360" y="668" width="490" height="52" rx="8" />
  <text class="label" x="384" y="694">8 · HumanInTheLoopMiddleware</text>
  <text class="small" x="384" y="712">传入 interrupt_on 时启用 · 暂停待审批</text>
  <text class="tag" x="774" y="699">interrupt_on</text>

  <path class="edge" d="M 850 694 H 908 V 500" />

  <!-- Model call -->
  <rect class="node enter" x="908" y="330" width="244" height="130" rx="12" />
  <text class="eyebrow" x="932" y="366">MODEL CALL</text>
  <text class="label" x="932" y="400">模型 + 工具</text>
  <text class="small" x="932" y="426">tool calling</text>
  <text class="small" x="932" y="448">结构化 / 文本输出</text>

  <text class="small" x="908" y="510">替换默认层：</text>
  <text class="code" x="908" y="534">middleware=[Custom(...)]</text>
  <text class="small" x="908" y="562">按 .name 匹配即原地替换，</text>
  <text class="small" x="908" y="584">是完全覆盖而非合并。</text>
  <text class="small" x="908" y="620">跨 hook 追踪状态时用图状态，</text>
  <text class="small" x="908" y="642">不要就地改实例属性（并发风险）。</text>
</svg>
