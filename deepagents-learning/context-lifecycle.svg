<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Deep Agents 上下文压缩生命周期</title>
  <desc id="desc">随着对话增长，Deep Agents 先把超过 2 万 token 的工具输入输出卸载到文件系统，只保留路径指针与前 10 行预览；当上下文越过模型窗口约 85% 且无法再卸载时，触发摘要中间件，把旧消息压缩成结构化摘要并把原始消息写入文件保留。</desc>
  <style>
    :root {
      --bg: #f6f3eb;
      --fg: #1d2935;
      --muted: #66727c;
      --line: #7b8790;
      --border: #c8c8bd;
      --grow: #d9e1f1;
      --offload: #d5e8df;
      --summarize: #f5e4b8;
      --alert: #f6d7c9;
      --zone: #e9e6dc;
      --accent: #476d7c;
      --track: #cfd7c9;
      --fill: #476d7c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b2023;
        --fg: #eef1eb;
        --muted: #b1b9b6;
        --line: #9ca9a6;
        --border: #596463;
        --grow: #344b60;
        --offload: #31554b;
        --summarize: #665535;
        --alert: #69493f;
        --zone: #252c2f;
        --accent: #9bc3cf;
        --track: #333b3a;
        --fill: #9bc3cf;
      }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 8 7; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.5; marker-end: url(#arrow); }
    .node { stroke: var(--border); stroke-width: 1.5; }
    .grow { fill: var(--grow); }
    .offload { fill: var(--offload); }
    .summarize { fill: var(--summarize); }
    .alert { fill: var(--alert); }
    .track { fill: var(--track); }
    .fill { fill: var(--fill); }
    .eyebrow { fill: var(--accent); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
    .title { fill: var(--fg); font: 700 29px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .label { fill: var(--fg); font: 700 20px/1.3 ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--muted); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .code { fill: var(--accent); font: 600 15px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .mark { fill: var(--fg); font: 700 14px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="640" />
  <text class="eyebrow" x="48" y="52">CONTEXT COMPRESSION / LIFECYCLE</text>
  <text class="title" x="48" y="90">上下文快满时，先卸载，再摘要</text>
  <text class="small" x="48" y="120">默认阈值：单次工具输入 / 输出超过约 20,000 token 就卸载到文件；上下文越过模型窗口约 85% 且无可卸载内容时，触发摘要。</text>

  <!-- Context window gauge -->
  <text class="code" x="48" y="168">上下文窗口占用</text>
  <rect class="node track" x="48" y="184" width="1104" height="40" rx="8" />
  <rect class="node fill" x="48" y="184" width="938" height="40" rx="8" />
  <line x1="986" y1="170" x2="986" y2="240" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5" />
  <text class="mark" x="940" y="262">85% · 触发摘要</text>
  <text class="small" x="1060" y="210">100%</text>

  <!-- Stage 1 -->
  <rect class="node grow" x="48" y="300" width="330" height="240" rx="12" />
  <text class="eyebrow" x="74" y="336">STAGE 01</text>
  <text class="label" x="74" y="368">对话增长</text>
  <text class="small" x="74" y="402">工具调用、搜索结果、</text>
  <text class="small" x="74" y="426">草稿不断累积。</text>
  <text class="small" x="74" y="470">短对话完全够用，</text>
  <text class="small" x="74" y="494">不需要任何压缩。</text>

  <path class="edge" d="M 378 420 H 430" />

  <!-- Stage 2 -->
  <rect class="node offload" x="430" y="300" width="330" height="240" rx="12" />
  <text class="eyebrow" x="456" y="336">STAGE 02 · OFFLOAD</text>
  <text class="label" x="456" y="368">卸载到文件系统</text>
  <text class="small" x="456" y="402">超过 ~20k token 的工具</text>
  <text class="small" x="456" y="426">输入 / 输出写入 backend。</text>
  <text class="code" x="456" y="466">保留：路径指针</text>
  <text class="code" x="456" y="490">+ 前 10 行预览</text>
  <text class="small" x="456" y="522">需要时再 read_file / grep 拉回</text>

  <path class="edge" d="M 760 420 H 812" />

  <!-- Stage 3 -->
  <rect class="node summarize" x="812" y="300" width="340" height="240" rx="12" />
  <text class="eyebrow" x="838" y="336">STAGE 03 · SUMMARIZE</text>
  <text class="label" x="838" y="368">摘要旧消息</text>
  <text class="small" x="838" y="402">越过 85% 且无可卸载时触发。</text>
  <text class="code" x="838" y="440">内存：结构化摘要</text>
  <text class="small" x="838" y="464">意图 · 已产出 · 下一步</text>
  <text class="code" x="838" y="500">磁盘：原始消息全文</text>
  <text class="small" x="838" y="524">作为规范记录保留</text>

  <text class="small" x="48" y="588">主动压缩：create_summarization_tool_middleware 提供 compact_conversation 工具，让 agent 在任务之间自己触发压缩。</text>
  <text class="small" x="48" y="614">流式时可用 metadata.lc_source == "summarization" 过滤掉摘要产生的 token，避免污染前端输出。</text>
</svg>
