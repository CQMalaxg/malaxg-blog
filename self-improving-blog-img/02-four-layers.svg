<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="t2 d2">
  <title id="t2">自改进的四个可改层级</title>
  <desc id="d2">从下到上四层：L1 上下文与经验层、L2 技能与工具层、L3 架构与工作流层、L4 权重层。越往上风险、成本与不可逆性越高，建议从 L1 开始。</desc>
  <style>
    :root{
      --bg:#f6f3eb;--fg:#1d2935;--muted:#66727c;--line:#7b8790;--border:#c8c8bd;
      --l1:#397b68;--l1f:#d6e8df;--l2:#3e6fa7;--l2f:#dde7f3;
      --l3:#8a5a2b;--l3f:#f3e6cf;--l4:#b3603f;--l4f:#f1ddd3;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1b2023;--fg:#eef1eb;--muted:#b1b9b6;--line:#9ca9a6;--border:#596463;
        --l1:#80c6aa;--l1f:#2b4a41;--l2:#8eb9e4;--l2f:#2c3d52;
        --l3:#e2b16d;--l3f:#4a3b23;--l4:#e2977a;--l4f:#43302a;
      }
    }
    .bg{fill:var(--bg);}
    .b1{fill:var(--l1f);stroke:var(--l1);stroke-width:2.4;}
    .b2{fill:var(--l2f);stroke:var(--l2);stroke-width:1.8;}
    .b3{fill:var(--l3f);stroke:var(--l3);stroke-width:1.8;}
    .b4{fill:var(--l4f);stroke:var(--l4);stroke-width:1.8;}
    .axis{fill:none;stroke:var(--line);stroke-width:2.4;marker-end:url(#a2);}
    .eyebrow{fill:var(--muted);font:700 13px/1.3 ui-monospace,monospace;letter-spacing:2px;}
    .title{fill:var(--fg);font:700 25px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .tag{font:800 15px/1 ui-monospace,monospace;}
    .g1{fill:var(--l1);}.g2{fill:var(--l2);}.g3{fill:var(--l3);}.g4{fill:var(--l4);}
    .name{fill:var(--fg);font:700 18px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .sub{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
    .work{fill:var(--muted);font:12px/1.3 ui-monospace,monospace;}
    .axis-lbl{fill:var(--muted);font:600 13px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .badge{font:700 12px/1 ui-sans-serif,system-ui,sans-serif;}
    .rec{fill:var(--l1);font:700 14px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .foot{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
  </style>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker>
  </defs>

  <rect class="bg" width="1080" height="540"/>
  <text class="eyebrow" x="44" y="44">WHAT TO EVOLVE / FOUR LAYERS</text>
  <text class="title" x="44" y="78">改什么？四个层级，按风险排序</text>

  <!-- risk axis -->
  <path class="axis" d="M96 448 V 128"/>
  <text class="axis-lbl" x="82" y="300" text-anchor="middle" transform="rotate(-90 82 300)">风险 · 成本 · 不可逆性 递增</text>

  <!-- L4 top -->
  <rect class="b4" x="128" y="120" width="738" height="76" rx="9"/>
  <text class="tag g4" x="152" y="150">L4</text>
  <text class="name" x="196" y="149">权重层</text>
  <text class="sub" x="196" y="174">改模型参数：SFT / RL / 蒸馏</text>
  <text class="work" x="600" y="149">SEAL · self-edits</text>
  <text class="work" x="600" y="174">慢 · 贵 · 需重训才能回退</text>
  <text class="badge g4" x="890" y="163">不可回滚</text>

  <!-- L3 -->
  <rect class="b3" x="128" y="212" width="738" height="76" rx="9"/>
  <text class="tag g3" x="152" y="242">L3</text>
  <text class="name" x="196" y="241">架构 / 工作流层</text>
  <text class="sub" x="196" y="266">改拓扑、节点，甚至让 Agent 自改代码</text>
  <text class="work" x="600" y="241">ADAS · DGM · AWM</text>
  <text class="work" x="600" y="266">能力上限最高，也最危险</text>
  <text class="badge g3" x="890" y="255">难回滚</text>

  <!-- L2 -->
  <rect class="b2" x="128" y="304" width="738" height="76" rx="9"/>
  <text class="tag g2" x="152" y="334">L2</text>
  <text class="name" x="196" y="333">技能 / 工具层</text>
  <text class="sub" x="196" y="358">沉淀可复用技能、自建工具</text>
  <text class="work" x="600" y="333">Voyager · SkillOpt</text>
  <text class="work" x="600" y="358">删掉技能即回退</text>
  <text class="badge g2" x="890" y="347">可回滚</text>

  <!-- L1 bottom, recommended -->
  <rect class="b1" x="128" y="396" width="738" height="82" rx="9"/>
  <text class="tag g1" x="152" y="426">L1</text>
  <text class="name" x="196" y="425">上下文 / 经验层</text>
  <text class="sub" x="196" y="450">改 prompt、memory、经验手册</text>
  <text class="work" x="600" y="425">ACE · ExpeL · Reflexion · GEPA</text>
  <text class="work" x="600" y="450">快 · 便宜 · 改一行文本即回退</text>
  <text class="badge g1" x="890" y="433">易回滚</text>
  <text class="rec" x="890" y="459">★ 从这里开始</text>

  <text class="foot" x="44" y="512">经验法则：先把 L1 做透再往上走。反思式提示词进化（GEPA）曾以 35 倍更少的 rollout，平均超过 L4 强化学习基线约 10%。</text>
</svg>
