<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="t6 d6">
  <title id="t6">经验规则的状态机</title>
  <desc id="d6">机器只能自动产出候选态；候选经显式决策后成为已激活，是唯一被注入运行时的状态；发现失效或冲突直接下线为已归档或已拒绝；被新版本取代时降级；冲突态为人工待裁，既不注入也不归档。</desc>
  <style>
    :root{
      --bg:#f6f3eb;--fg:#1d2935;--muted:#66727c;--line:#7b8790;--border:#c8c8bd;--card:#eeeae0;
      --cand:#7a5aa6;--cand-f:#e6dcef;--act:#397b68;--act-f:#d6e8df;
      --arch:#66727c;--arch-f:#eeeae0;--cf:#8a5a2b;--cf-f:#f3e6cf;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1b2023;--fg:#eef1eb;--muted:#b1b9b6;--line:#9ca9a6;--border:#596463;--card:#2b3133;
        --cand:#c9a7ec;--cand-f:#3a2f4a;--act:#80c6aa;--act-f:#2b4a41;
        --arch:#b1b9b6;--arch-f:#2b3133;--cf:#e2b16d;--cf-f:#4a3b23;
      }
    }
    .bg{fill:var(--bg);}
    .s-cand{fill:var(--cand-f);stroke:var(--cand);stroke-width:2;}
    .s-act{fill:var(--act-f);stroke:var(--act);stroke-width:2.8;}
    .s-arch{fill:var(--arch-f);stroke:var(--arch);stroke-width:1.6;}
    .s-cf{fill:var(--cf-f);stroke:var(--cf);stroke-width:1.8;stroke-dasharray:5 4;}
    .line{fill:none;stroke:var(--line);stroke-width:2.4;marker-end:url(#a6);}
    .line-h{fill:none;stroke:var(--act);stroke-width:2.8;marker-end:url(#a6a);}
    .eyebrow{fill:var(--muted);font:700 13px/1.3 ui-monospace,monospace;letter-spacing:2px;}
    .title{fill:var(--fg);font:700 25px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .st{fill:var(--fg);font:700 18px/1.2 ui-monospace,monospace;}
    .sub{fill:var(--muted);font:12px/1.35 ui-sans-serif,system-ui,sans-serif;}
    .edge{fill:var(--muted);font:600 12.5px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .edge-h{fill:var(--act);font:700 13px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .only{fill:var(--act);font:700 12px/1 ui-sans-serif,system-ui,sans-serif;}
    .foot{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
  </style>
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--line)"/></marker>
    <marker id="a6a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--act)"/></marker>
  </defs>

  <rect class="bg" width="1080" height="460"/>
  <text class="eyebrow" x="44" y="42">LIFECYCLE / ACTIVATION IS A SEPARATE DECISION</text>
  <text class="title" x="44" y="76">激活是独立生命周期，没有自动晋升</text>

  <!-- candidate -->
  <rect class="s-cand" x="60" y="150" width="230" height="106" rx="10"/>
  <text class="st" x="84" y="188">candidate</text>
  <text class="sub" x="84" y="214">机器唯一能自动写入的终态</text>
  <text class="sub" x="84" y="236">不注入运行时</text>

  <!-- active -->
  <rect class="s-act" x="425" y="150" width="230" height="106" rx="10"/>
  <text class="st" x="449" y="188">active</text>
  <text class="sub" x="449" y="214">唯一被注入的状态</text>
  <text class="sub" x="449" y="236">限量加载，按置信度排序</text>
  <text class="only" x="449" y="278">★ 未激活不注入</text>

  <!-- archived / rejected -->
  <rect class="s-arch" x="790" y="150" width="230" height="106" rx="10"/>
  <text class="st" x="814" y="188">archived / rejected</text>
  <text class="sub" x="814" y="214">退出运行时</text>
  <text class="sub" x="814" y="236">保留为资产，不物理删除</text>

  <!-- conflicted -->
  <rect class="s-cf" x="425" y="330" width="230" height="76" rx="10"/>
  <text class="st" x="449" y="364">conflicted</text>
  <text class="sub" x="449" y="390">人工待裁：不注入，也不归档</text>

  <!-- edges -->
  <path class="line-h" d="M290 190 H 423"/>
  <text class="edge-h" x="356" y="178" text-anchor="middle">显式决策激活</text>
  <text class="edge" x="356" y="216" text-anchor="middle">人工或独立流程</text>

  <path class="line" d="M655 190 H 788"/>
  <text class="edge" x="721" y="178" text-anchor="middle">发现失效或冲突</text>
  <text class="edge" x="721" y="216" text-anchor="middle">直接下线</text>

  <path class="line" d="M540 258 V 328"/>
  <text class="edge" x="556" y="298">与已有规则矛盾</text>

  <text class="foot" x="44" y="436">激活前必须确认：规则中不含用户事实或可识别个人信息。被新版本取代的规则降级为 superseded，同样保留可追溯历史。</text>
</svg>
