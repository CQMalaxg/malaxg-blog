<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t5 d5">
  <title id="t5">深反思归纳流水线</title>
  <desc id="d5">领取待处理候选、按作用域与类型分组、按文本相似度聚类、成簇不小于二才归纳、写入状态为候选的规则、写证据边、最后留痕。整个处理块在单一隔离域内加锁串行。</desc>
  <style>
    :root{
      --bg:#f6f3eb;--fg:#1d2935;--muted:#66727c;--line:#7b8790;--border:#c8c8bd;--card:#eeeae0;
      --dp:#7a5aa6;--dp-f:#e6dcef;--ok:#397b68;--ok-f:#d6e8df;--lk:#8a5a2b;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1b2023;--fg:#eef1eb;--muted:#b1b9b6;--line:#9ca9a6;--border:#596463;--card:#2b3133;
        --dp:#c9a7ec;--dp-f:#3a2f4a;--ok:#80c6aa;--ok-f:#2b4a41;--lk:#e2b16d;
      }
    }
    .bg{fill:var(--bg);}
    .lock{fill:none;stroke:var(--lk);stroke-width:1.6;stroke-dasharray:6 4;}
    .n{fill:var(--dp-f);stroke:var(--dp);stroke-width:1.7;}
    .n-ok{fill:var(--ok-f);stroke:var(--ok);stroke-width:1.7;}
    .line{fill:none;stroke:var(--line);stroke-width:2.2;marker-end:url(#a5);}
    .eyebrow{fill:var(--muted);font:700 13px/1.3 ui-monospace,monospace;letter-spacing:2px;}
    .title{fill:var(--fg);font:700 25px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .name{fill:var(--fg);font:700 15px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .sub{fill:var(--muted);font:11.5px/1.3 ui-monospace,monospace;}
    .lock-t{fill:var(--lk);font:700 12px/1 ui-sans-serif,system-ui,sans-serif;}
    .foot{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
    .step{fill:var(--dp);font:800 11px/1 ui-monospace,monospace;}
  </style>
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker>
  </defs>

  <rect class="bg" width="1080" height="440"/>
  <text class="eyebrow" x="44" y="42">DEEP REFLECTION / INDUCTION PIPELINE</text>
  <text class="title" x="44" y="76">归纳流水线：只消费候选，只产出候选</text>

  <rect class="lock" x="44" y="106" width="992" height="150" rx="10"/>
  <text class="lock-t" x="66" y="130">单一隔离域 + 单目标 Agent 处理块 · 加锁串行 · 归还连接前显式释放锁</text>

  <rect class="n" x="66" y="144" width="150" height="94" rx="8"/>
  <text class="step" x="86" y="168">01</text><text class="name" x="86" y="192">领取候选</text>
  <text class="sub" x="86" y="214">status=pending</text><text class="sub" x="86" y="232">跳过已锁行</text>

  <rect class="n" x="242" y="144" width="150" height="94" rx="8"/>
  <text class="step" x="262" y="168">02</text><text class="name" x="262" y="192">分组</text>
  <text class="sub" x="262" y="214">scope / agent</text><text class="sub" x="262" y="232">/ 经验类型</text>

  <rect class="n" x="418" y="144" width="150" height="94" rx="8"/>
  <text class="step" x="438" y="168">03</text><text class="name" x="438" y="192">聚类</text>
  <text class="sub" x="438" y="214">bigram Jaccard</text><text class="sub" x="438" y="232">阈值 ≥ 0.4</text>

  <rect class="n" x="594" y="144" width="150" height="94" rx="8"/>
  <text class="step" x="614" y="168">04</text><text class="name" x="614" y="192">归纳</text>
  <text class="sub" x="614" y="214">簇大小 ≥ 2</text><text class="sub" x="614" y="232">孤例不成规则</text>

  <rect class="n-ok" x="770" y="144" width="150" height="94" rx="8"/>
  <text class="step" x="790" y="168">05</text><text class="name" x="790" y="192">写规则</text>
  <text class="sub" x="790" y="214">status=candidate</text><text class="sub" x="790" y="232">固定不自动上线</text>

  <path class="line" d="M216 191 H 240"/>
  <path class="line" d="M392 191 H 416"/>
  <path class="line" d="M568 191 H 592"/>
  <path class="line" d="M744 191 H 768"/>

  <rect class="n-ok" x="470" y="296" width="176" height="76" rx="8"/>
  <text class="step" x="490" y="320">06</text><text class="name" x="490" y="342">写证据边</text>
  <text class="sub" x="490" y="362">规则 ↔ 来源候选</text>

  <rect class="n-ok" x="700" y="296" width="176" height="76" rx="8"/>
  <text class="step" x="720" y="320">07</text><text class="name" x="720" y="342">留痕</text>
  <text class="sub" x="720" y="362">本次运行状态与摘要</text>

  <path class="line" d="M845 240 C 845 268 700 268 646 292"/>
  <path class="line" d="M646 334 H 698"/>

  <text class="foot" x="44" y="410">硬约束：一次运行不得跨隔离域聚合；机器写出的规则一律是「候选」态，不进入运行时。</text>
</svg>
