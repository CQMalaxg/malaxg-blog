<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="t1 d1">
  <title id="t1">Agent 自改进闭环</title>
  <desc id="d1">六步闭环：运行、留痕、反思、归纳、激活、注入，再回到运行。其中运行与留痕、注入在在线路径，反思与归纳在离线路径，激活是人在环的显式决策。</desc>
  <style>
    :root{
      --bg:#f6f3eb;--fg:#1d2935;--muted:#66727c;--line:#7b8790;--border:#c8c8bd;--card:#eeeae0;
      --on:#3e6fa7;--on-fill:#dde7f3;--off:#7a5aa6;--off-fill:#e6dcef;--hum:#8a5a2b;--hum-fill:#f3e6cf;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1b2023;--fg:#eef1eb;--muted:#b1b9b6;--line:#9ca9a6;--border:#596463;--card:#2b3133;
        --on:#8eb9e4;--on-fill:#2c3d52;--off:#c9a7ec;--off-fill:#3a2f4a;--hum:#e2b16d;--hum-fill:#4a3b23;
      }
    }
    .bg{fill:var(--bg);}
    .n-on{fill:var(--on-fill);stroke:var(--on);stroke-width:1.8;}
    .n-off{fill:var(--off-fill);stroke:var(--off);stroke-width:1.8;}
    .n-hum{fill:var(--hum-fill);stroke:var(--hum);stroke-width:2.4;}
    .band-on{fill:none;stroke:var(--on);stroke-width:1.4;stroke-dasharray:4 4;}
    .band-off{fill:none;stroke:var(--off);stroke-width:1.4;stroke-dasharray:4 4;}
    .band-hum{fill:none;stroke:var(--hum);stroke-width:1.4;stroke-dasharray:4 4;}
    .line{fill:none;stroke:var(--line);stroke-width:2.4;marker-end:url(#a1);}
    .back{fill:none;stroke:var(--on);stroke-width:2.6;marker-end:url(#a1b);}
    .eyebrow{fill:var(--muted);font:700 13px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;}
    .titletext{fill:var(--fg);font:700 25px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .idx{font:800 12px/1 ui-monospace,monospace;}
    .i-on{fill:var(--on);}.i-off{fill:var(--off);}.i-hum{fill:var(--hum);}
    .name{fill:var(--fg);font:700 17px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .sub{fill:var(--muted);font:12px/1.35 ui-sans-serif,system-ui,sans-serif;}
    .bl-on{fill:var(--on);font:700 12px/1 ui-monospace,monospace;letter-spacing:1px;}
    .bl-off{fill:var(--off);font:700 12px/1 ui-monospace,monospace;letter-spacing:1px;}
    .bl-hum{fill:var(--hum);font:700 12px/1 ui-monospace,monospace;letter-spacing:1px;}
    .ret{fill:var(--on);font:600 14px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .foot{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
  </style>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--line)"/></marker>
    <marker id="a1b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--on)"/></marker>
  </defs>

  <rect class="bg" width="1080" height="520"/>
  <text class="eyebrow" x="44" y="44">SELF-IMPROVING / THE CLOSED LOOP</text>
  <text class="titletext" x="44" y="78">把「这次怎么做成的」变成下次的先验</text>

  <!-- bands -->
  <rect class="band-on" x="50" y="120" width="316" height="26" rx="6"/>
  <text class="bl-on" x="208" y="138" text-anchor="middle">在线 · 对话链路</text>
  <rect class="band-off" x="382" y="120" width="316" height="26" rx="6"/>
  <text class="bl-off" x="540" y="138" text-anchor="middle">离线 · 后台 worker</text>
  <rect class="band-hum" x="714" y="120" width="150" height="26" rx="6"/>
  <text class="bl-hum" x="789" y="138" text-anchor="middle">人在环</text>
  <rect class="band-on" x="880" y="120" width="150" height="26" rx="6"/>
  <text class="bl-on" x="955" y="138" text-anchor="middle">在线</text>

  <!-- nodes -->
  <rect class="n-on" x="50" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-on" x="70" y="200">01</text>
  <text class="name" x="70" y="226">运行</text>
  <text class="sub" x="70" y="248">Agent 执行任务</text>
  <text class="sub" x="70" y="264">产生完整轨迹</text>

  <rect class="n-on" x="216" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-on" x="236" y="200">02</text>
  <text class="name" x="236" y="226">留痕</text>
  <text class="sub" x="236" y="248">写证据 + 入队</text>
  <text class="sub" x="236" y="264">白名单，克制采集</text>

  <rect class="n-off" x="382" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-off" x="402" y="200">03</text>
  <text class="name" x="402" y="226">反思</text>
  <text class="sub" x="402" y="248">单轨迹原子提取</text>
  <text class="sub" x="402" y="264">产出候选经验</text>

  <rect class="n-off" x="548" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-off" x="568" y="200">04</text>
  <text class="name" x="568" y="226">归纳</text>
  <text class="sub" x="568" y="248">跨轨迹聚类</text>
  <text class="sub" x="568" y="264">升级为规范规则</text>

  <rect class="n-hum" x="714" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-hum" x="734" y="200">05</text>
  <text class="name" x="734" y="226">激活</text>
  <text class="sub" x="734" y="248">显式决策上线</text>
  <text class="sub" x="734" y="264">无自动晋升</text>

  <rect class="n-on" x="880" y="176" width="150" height="94" rx="9"/>
  <text class="idx i-on" x="900" y="200">06</text>
  <text class="name" x="900" y="226">注入</text>
  <text class="sub" x="900" y="248">拼进 system prompt</text>
  <text class="sub" x="900" y="264">单次运行内稳定</text>

  <!-- arrows -->
  <path class="line" d="M200 223 H 214"/>
  <path class="line" d="M366 223 H 380"/>
  <path class="line" d="M532 223 H 546"/>
  <path class="line" d="M698 223 H 712"/>
  <path class="line" d="M864 223 H 878"/>

  <!-- return path -->
  <path class="back" d="M955 270 V 340 H 125 V 272"/>
  <text class="ret" x="540" y="364" text-anchor="middle">下一次运行，带着上一次沉淀的经验出发</text>

  <text class="foot" x="44" y="424">关键分工：在线只做「读经验 + 写证据 + 入队」三件轻活，重加工全部离线，因此对话时延不依赖反思是否跑完。</text>
  <text class="foot" x="44" y="452">关键闸门：机器唯一能自动写入的终态是「候选」，从候选到生效必须经过一次显式决策——这是整套系统的安全阀。</text>
</svg>
