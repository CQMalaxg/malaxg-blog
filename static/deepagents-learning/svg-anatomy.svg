<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">SVG 图解的三个基本元素</title>
  <desc id="desc">使用 rect 表示节点，使用 path 表示关系，使用 text 表示解释，三者组合成可读的 Deep Agents 图解。</desc>
  <style>
    :root {
      --bg: #f6f3eb;
      --fg: #1d2935;
      --muted: #66727c;
      --line: #7b8790;
      --border: #c8c8bd;
      --node: #d9e1f1;
      --edge: #d5e8df;
      --label: #f5e4b8;
      --accent: #476d7c;
      --code: #eeeae0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b2023;
        --fg: #eef1eb;
        --muted: #b1b9b6;
        --line: #9ca9a6;
        --border: #596463;
        --node: #344b60;
        --edge: #31554b;
        --label: #665535;
        --accent: #9bc3cf;
        --code: #2b3133;
      }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--code); stroke: var(--border); stroke-width: 1.5; }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .edge-box { fill: var(--edge); stroke: var(--border); stroke-width: 1.5; }
    .label-box { fill: var(--label); stroke: var(--border); stroke-width: 1.5; }
    .line { fill: none; stroke: var(--line); stroke-width: 2.5; marker-end: url(#arrow); }
    .eyebrow { fill: var(--accent); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
    .title { fill: var(--fg); font: 700 26px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .label { fill: var(--fg); font: 700 20px/1.3 ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--muted); font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .code { fill: var(--accent); font: 600 15px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .code-muted { fill: var(--muted); font: 15px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" width="1080" height="500" />
  <text class="eyebrow" x="44" y="48">SVG / THREE PRIMITIVES</text>
  <text class="title" x="44" y="84">把一张图拆成结构、关系和解释</text>

  <rect class="card" x="44" y="120" width="330" height="310" rx="10" />
  <text class="code" x="72" y="154">01  MARKUP</text>
  <text class="code-muted" x="72" y="195">&lt;rect class="node" /&gt;</text>
  <text class="code-muted" x="72" y="226">&lt;path class="edge" /&gt;</text>
  <text class="code-muted" x="72" y="257">&lt;text&gt;主 Agent&lt;/text&gt;</text>
  <text class="small" x="72" y="311">先写清楚图上的对象，</text>
  <text class="small" x="72" y="338">再写它们之间的方向关系。</text>
  <text class="small" x="72" y="384">SVG 是文本格式，适合版本控制。</text>

  <path class="line" d="M 396 275 H 474" />

  <rect class="node" x="500" y="160" width="220" height="100" rx="10" />
  <text class="code" x="526" y="194">&lt;rect&gt;</text>
  <text class="label" x="526" y="227">节点 / 对象</text>
  <text class="small" x="526" y="251">主 Agent、文件区</text>

  <path class="line" d="M 610 260 V 318" />

  <rect class="edge-box" x="500" y="330" width="220" height="92" rx="10" />
  <text class="code" x="526" y="363">&lt;path&gt;</text>
  <text class="label" x="526" y="394">关系 / 流向</text>

  <path class="line" d="M 746 275 H 824" />

  <rect class="label-box" x="850" y="185" width="188" height="178" rx="10" />
  <text class="code" x="875" y="219">&lt;text&gt;</text>
  <text class="label" x="875" y="256">解释 / 标签</text>
  <text class="small" x="875" y="290">让读者知道：</text>
  <text class="small" x="875" y="317">这是什么，</text>
  <text class="small" x="875" y="344">为什么连在一起。</text>

  <text class="small" x="44" y="470">练习：先画三个节点，再补两条带箭头的 path，最后给每个节点加 text。</text>
</svg>
