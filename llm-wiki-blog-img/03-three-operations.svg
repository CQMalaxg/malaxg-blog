<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="t3 d3">
  <title id="t3">三大操作与复利飞轮</title>
  <desc id="d3">INGEST 摄取、QUERY 查询、LINT 健康检查三大操作作用于知识库；QUERY 产生的好答案归档回库，形成越用越聪明的复利飞轮。</desc>
  <style>
    :root{
      --bg:#f6f3eb;--fg:#1d2935;--muted:#66727c;--line:#7b8790;--border:#c8c8bd;--card:#eeeae0;
      --in:#3e6fa7;--out:#397b68;--acc:#8a5a2b;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1b2023;--fg:#eef1eb;--muted:#b1b9b6;--line:#9ca9a6;--border:#596463;--card:#2b3133;
        --in:#8eb9e4;--out:#80c6aa;--acc:#e2b16d;
      }
    }
    .bg{fill:var(--bg);}
    .op{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .op-ingest{stroke:var(--out);stroke-width:2.4;}
    .op-query{stroke:var(--in);stroke-width:2;}
    .op-lint{stroke:var(--acc);stroke-width:2;}
    .kb{fill:var(--card);stroke:var(--fg);stroke-width:2;}
    .panel{fill:none;stroke:var(--border);stroke-width:1.5;}
    .line{fill:none;stroke:var(--line);stroke-width:2.4;marker-end:url(#a3);}
    .loop-out{fill:none;stroke:var(--out);stroke-width:2.2;stroke-dasharray:5 5;marker-end:url(#a3o);}
    .curve{fill:none;stroke:var(--out);stroke-width:3;}
    .axis{fill:none;stroke:var(--border);stroke-width:1.5;}
    .dot{fill:var(--out);}
    .eyebrow{fill:var(--muted);font:700 13px/1.3 ui-monospace,monospace;letter-spacing:2px;}
    .title{fill:var(--fg);font:700 25px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .op-name{font:800 17px/1 ui-monospace,monospace;}
    .n-ingest{fill:var(--out);}.n-query{fill:var(--in);}.n-lint{fill:var(--acc);}
    .op-desc{fill:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;}
    .kb-name{fill:var(--fg);font:700 18px/1.2 ui-sans-serif,system-ui,sans-serif;}
    .kb-sub{fill:var(--muted);font:12px/1.3 ui-monospace,monospace;}
    .lbl{fill:var(--muted);font:12px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .lbl-out{fill:var(--out);font:600 13px/1.3 ui-sans-serif,system-ui,sans-serif;}
    .cap{fill:var(--fg);font:600 14px/1.3 ui-sans-serif,system-ui,sans-serif;}
  </style>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--line)"/></marker>
    <marker id="a3o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--out)"/></marker>
  </defs>

  <rect class="bg" width="1080" height="520"/>
  <text class="eyebrow" x="44" y="44">OPERATIONS / INGEST · QUERY · LINT</text>
  <text class="title" x="44" y="78">三大操作，让知识库“活”起来</text>

  <!-- op cards -->
  <rect class="op op-ingest" x="52" y="118" width="300" height="98" rx="10"/>
  <text class="op-name n-ingest" x="74" y="152">INGEST · 摄取</text>
  <text class="op-desc" x="74" y="178">通读源 → 提炼要点 → 抽实体/概念</text>
  <text class="op-desc" x="74" y="198">建交叉引用（最重要，单次波及 10–15 页）</text>

  <rect class="op op-query" x="52" y="236" width="300" height="98" rx="10"/>
  <text class="op-name n-query" x="74" y="270">QUERY · 查询</text>
  <text class="op-desc" x="74" y="296">读索引定位 → 下钻核对 → 带引用作答</text>
  <text class="op-desc" x="74" y="316">好答案可归档回库</text>

  <rect class="op op-lint" x="52" y="354" width="300" height="98" rx="10"/>
  <text class="op-name n-lint" x="74" y="388">LINT · 健康检查</text>
  <text class="op-desc" x="74" y="414">扫断链 / 孤儿页 / 矛盾 / 陈旧</text>
  <text class="op-desc" x="74" y="434">报告 + 可选自动修复</text>

  <!-- KB -->
  <rect class="kb" x="440" y="222" width="176" height="126" rx="12"/>
  <text class="kb-name" x="528" y="278" text-anchor="middle">知识库</text>
  <text class="kb-sub" x="528" y="302" text-anchor="middle">docs/ · 互链网络</text>
  <text class="kb-sub" x="528" y="320" text-anchor="middle">6 种页面 + 系统页</text>

  <!-- arrows to KB -->
  <path class="line" d="M352 167 C 404 167 404 250 438 262"/>
  <path class="line" d="M352 285 H 438"/>
  <path class="line" d="M352 403 C 404 403 404 322 438 310"/>

  <!-- archive loop query -> back to KB -->
  <path class="loop-out" d="M528 348 C 528 400 372 400 352 322"/>
  <text class="lbl-out" x="392" y="392">好答案归档回库</text>

  <!-- flywheel panel -->
  <rect class="panel" x="680" y="118" width="356" height="334" rx="12"/>
  <text class="cap" x="704" y="150">复利飞轮</text>
  <text class="lbl" x="704" y="172">每个源、每次查询都在为知识库添砖加瓦</text>
  <!-- axes -->
  <path class="axis" d="M724 410 H 1004"/>
  <path class="axis" d="M724 410 V 200"/>
  <text class="lbl" x="1006" y="414" text-anchor="end">时间 / 使用次数 →</text>
  <text class="lbl" x="716" y="204" text-anchor="end" transform="rotate(-90 716 300)">知识密度</text>
  <!-- rising compounding curve -->
  <path class="curve" d="M724 402 C 812 398 872 360 916 300 C 948 256 972 224 1000 210"/>
  <circle class="dot" cx="760" cy="399" r="4"/>
  <circle class="dot" cx="832" cy="378" r="4"/>
  <circle class="dot" cx="896" cy="320" r="4"/>
  <circle class="dot" cx="956" cy="240" r="4"/>
  <circle class="dot" cx="1000" cy="210" r="4"/>
  <text class="lbl-out" x="852" y="248">越用越聪明（示意）</text>
</svg>
