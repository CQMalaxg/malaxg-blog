{{ if .IsPage }}
<style>
#reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: var(--primary);
    z-index: 9999;
    transition: width 0.08s linear;
}
</style>

<div id="reading-progress"></div>

<script>
(function () {
    var bar = document.getElementById('reading-progress');
    window.addEventListener('scroll', function () {
        var doc = document.documentElement;
        var scrolled = doc.scrollTop || document.body.scrollTop;
        var total = doc.scrollHeight - doc.clientHeight;
        bar.style.width = total > 0 ? (scrolled / total * 100) + '%' : '0%';
    });
})();
</script>

<script>
(function () {
    if (!('IntersectionObserver' in window)) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var targets = document.querySelectorAll(
        '.post-content > h2, .post-content > h3, .post-content > img, .post-content > p > img, .post-content > figure'
    );
    if (targets.length === 0) return;

    targets.forEach(function (el) { el.classList.add('reveal'); });

    var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('reveal-in');
                io.unobserve(entry.target);
            }
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

    targets.forEach(function (el) { io.observe(el); });
})();
</script>
{{ end }}

{{/* ========== 全站：图片 Lightbox ========== */}}
<div id="lightbox-overlay" role="dialog" aria-hidden="true">
    <button id="lightbox-close" aria-label="关闭">&times;</button>
    <img alt="预览" />
</div>
<script>
(function () {
    var imgs = document.querySelectorAll('.post-content img');
    if (imgs.length === 0) return;

    var overlay = document.getElementById('lightbox-overlay');
    var overlayImg = overlay.querySelector('img');
    var closeBtn = document.getElementById('lightbox-close');

    function open(src, alt) {
        overlayImg.src = src;
        overlayImg.alt = alt || '';
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
    }

    function close() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
    }

    imgs.forEach(function (img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function () { open(img.src, img.alt); });
    });

    overlay.addEventListener('click', function (e) {
        if (e.target === overlay || e.target === overlayImg) close();
    });
    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
    });
})();
</script>

{{/* ========== 全站：鼠标跟随光斑 ========== */}}
<div id="mouse-glow" aria-hidden="true"></div>
<script>
(function () {
    if (window.matchMedia('(max-width: 768px)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('ontouchstart' in window) === false) return;

    var glow = document.getElementById('mouse-glow');
    var x = window.innerWidth / 2;
    var y = window.innerHeight / 2;
    var raf = null;

    function update() {
        glow.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -50%)';
        raf = null;
    }

    document.addEventListener('mousemove', function (e) {
        x = e.clientX;
        y = e.clientY;
        if (!raf) raf = requestAnimationFrame(update);
    });
    update();
})();
</script>
