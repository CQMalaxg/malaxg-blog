{{- if .IsPage }}
<div id="reading-progress" aria-hidden="true"></div>
<script>
(function () {
    var bar = document.getElementById('reading-progress');
    var ticking = false;

    function updateProgress() {
        var doc = document.documentElement;
        var total = doc.scrollHeight - doc.clientHeight;
        var progress = total > 0 ? doc.scrollTop / total * 100 : 0;
        bar.style.width = progress + '%';
        ticking = false;
    }

    window.addEventListener('scroll', function () {
        if (!ticking) {
            window.requestAnimationFrame(updateProgress);
            ticking = true;
        }
    }, { passive: true });
    updateProgress();
})();
</script>

<script>
(function () {
    if (!('IntersectionObserver' in window)) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var targets = document.querySelectorAll('.post-content img, .post-content figure');
    if (!targets.length) return;

    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('reveal-in');
            observer.unobserve(entry.target);
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });

    targets.forEach(function (element) {
        element.classList.add('reveal');
        observer.observe(element);
    });
})();
</script>
{{- end }}

<div id="lightbox-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="图片预览">
    <button id="lightbox-close" type="button" aria-label="关闭图片预览">&times;</button>
    <img alt="">
</div>

<script>
(function () {
    var images = document.querySelectorAll('.post-content img');
    if (!images.length) return;

    var overlay = document.getElementById('lightbox-overlay');
    var preview = overlay.querySelector('img');
    var closeButton = document.getElementById('lightbox-close');
    var trigger = null;

    function openLightbox(image) {
        trigger = image;
        preview.src = image.currentSrc || image.src;
        preview.alt = image.alt || '文章图片预览';
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
    }

    function closeLightbox() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        preview.removeAttribute('src');
        if (trigger) trigger.focus({ preventScroll: true });
    }

    images.forEach(function (image) {
        image.tabIndex = 0;
        image.addEventListener('click', function () { openLightbox(image); });
        image.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openLightbox(image);
            }
        });
    });

    overlay.addEventListener('click', function (event) {
        if (event.target === overlay) closeLightbox();
    });
    closeButton.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && overlay.classList.contains('active')) closeLightbox();
    });
})();
</script>
