baseURL = "https://malaxg.top/"
languageCode = "zh-cn"
title = "麻辣香郭的精神家园"
theme = "PaperMod"
paginate = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  author = "malaxg"
  description = "这是一个关于malaxg的个人博客，记录一些碎碎念"
  defaultTheme = "auto" # auto / light / dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.homeInfoParams]
  Title = "Hi, 我是malaxg👋"
  Content = "这是一个关于malaxg的个人博客，记录一些碎碎念"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/CQMalaxg"

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3