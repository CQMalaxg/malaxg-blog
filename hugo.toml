baseURL = "https://malaxg.top/"
locale = "zh-CN"
title = "麻辣香郭的精神家园"
theme = "PaperMod"
paginate = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  author = "malaxg"
  description = "记录 LLM 工程、Agent 系统、数据挖掘，以及一个普通人的成长路径。"
  keywords = ["LLM", "AI Agent", "数据挖掘", "推荐系统", "个人博客"]
  defaultTheme = "auto" # auto / light / dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  DateFormat = "2006 年 01 月 02 日"
  displayFullLangName = true

[params.profileMode]
  enabled = false
  title = "Hi, 我是malaxg 👋"
  subtitle = "这是一个关于malaxg的个人博客，记录一些碎碎念"
  imageUrl = ""
  imageWidth = 120
  imageHeight = 120
  imageTitle = "malaxg"

  [[params.profileMode.buttons]]
    name = "文章"
    url = "/posts"

  [[params.profileMode.buttons]]
    name = "学习资料"
    url = "/lab"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/CQMalaxg"

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "学习资料"
    url = "/lab/"
    weight = 4
